<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-label="Card payments by Coimbra customers per hour today against a normal day">
<style>
  .bg { fill: #fcfcfb; } .grid { stroke: #e4e3df; stroke-width: 1; }
