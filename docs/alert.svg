  .f2 { fill: #c9c7bf; } .band { fill: #2a78d6; opacity: .12; } .shade { fill: #eb6834; opacity: .08; }
  .line { fill: none; stroke-width: 2.5; } .dash { stroke-dasharray: 5 4; }
  .white { fill: #ffffff; font: 600 12px system-ui, -apple-system, sans-serif; }
